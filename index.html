<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Road Rush</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div id="game">

    <div id="topbar">

      <div id="score">
        Score: 0
      </div>

      <div id="level">
        Level: 1
      </div>

      <div id="lives">
        ❤️ ❤️ ❤️
      </div>

      <button id="pauseButton">
        ⏸️
      </button>

    </div>


    <canvas
      id="canvas"
      width="400"
      height="600">
    </canvas>


    <div id="controls">

      <button id="leftButton">
        ⬅️
      </button>

      <button id="rightButton">
        ➡️
      </button>

    </div>


    <div id="help">
      PC: ← → of A / D<br>
      Telefoon: gebruik de knoppen
    </div>

  </div>


  <script>

    // =================================
    // ROAD RUSH
    // =================================

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");


    // =================================
    // TEKST
    // =================================

    const scoreElement =
      document.getElementById("score");

    const levelElement =
      document.getElementById("level");

    const livesElement =
      document.getElementById("lives");


    // =================================
    // KNOPPEN
    // =================================

    const pauseButton =
      document.getElementById("pauseButton");

    const leftButton =
      document.getElementById("leftButton");

    const rightButton =
      document.getElementById("rightButton");


    // =================================
    // GAME
    // =================================

    let score = 0;

    let level = 1;

    let lives = 3;

    let paused = false;

    let gameOver = false;

    let spawnTimer = 0;

    let roadOffset = 0;


    // =================================
    // BESTURING
    // =================================

    let moveLeft = false;

    let moveRight = false;


    // =================================
    // SPELER
    // =================================

    const player = {

      x: 180,

      y: 500,

      width: 40,

      height: 70,

      speed: 6

    };


    // =================================
    // VIJANDEN
    // =================================

    let enemies = [];


    // =================================
    // PC BESTURING
    // =================================

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "ArrowLeft" ||
          event.key.toLowerCase() === "a"
        ) {

          moveLeft = true;

        }


        if (
          event.key === "ArrowRight" ||
          event.key.toLowerCase() === "d"
        ) {

          moveRight = true;

        }


        if (event.code === "Space") {

          event.preventDefault();

          togglePause();

        }

      }
    );


    document.addEventListener(
      "keyup",
      function(event) {

        if (
          event.key === "ArrowLeft" ||
          event.key.toLowerCase() === "a"
        ) {

          moveLeft = false;

        }


        if (
          event.key === "ArrowRight" ||
          event.key.toLowerCase() === "d"
        ) {

          moveRight = false;

        }

      }
    );


    // =================================
    // TELEFOON BESTURING
    // =================================

    function leftStart(event) {

      event.preventDefault();

      moveLeft = true;

    }


    function leftStop(event) {

      event.preventDefault();

      moveLeft = false;

    }


    function rightStart(event) {

      event.preventDefault();

      moveRight = true;

    }


    function rightStop(event) {

      event.preventDefault();

      moveRight = false;

    }


    leftButton.addEventListener(
      "pointerdown",
      leftStart
    );

    leftButton.addEventListener(
      "pointerup",
      leftStop
    );

    leftButton.addEventListener(
      "pointercancel",
      leftStop
    );

    leftButton.addEventListener(
      "pointerleave",
      leftStop
    );


    rightButton.addEventListener(
      "pointerdown",
      rightStart
    );

    rightButton.addEventListener(
      "pointerup",
      rightStop
    );

    rightButton.addEventListener(
      "pointercancel",
      rightStop
    );

    rightButton.addEventListener(
      "pointerleave",
      rightStop
    );


    // =================================
    // PAUZE
    // =================================

    pauseButton.addEventListener(
      "click",
      togglePause
    );


    function togglePause() {

      if (gameOver) {
        return;
      }

      paused = !paused;

      if (paused) {

        pauseButton.textContent = "▶️";

      } else {

        pauseButton.textContent = "⏸️";

      }

    }


    // =================================
    // UI
    // =================================

    function updateUI() {

      scoreElement.textContent =
        "Score: " + score;

      levelElement.textContent =
        "Level: " + level;


      if (lives === 3) {

        livesElement.textContent =
          "❤️ ❤️ ❤️";

      }

      else if (lives === 2) {

        livesElement.textContent =
          "❤️ ❤️ 🖤";

      }

      else if (lives === 1) {

        livesElement.textContent =
          "❤️ 🖤 🖤";

      }

      else {

        livesElement.textContent =
          "🖤 🖤 🖤";

      }

    }


    // =================================
    // VIJAND MAKEN
    // =================================

    function spawnEnemy() {

      const lanes = [
        80,
        180,
        280
      ];


      const lane =
        lanes[
          Math.floor(
            Math.random() * lanes.length
          )
        ];


      // Elke level sneller

      const speed =
        2 +
        (level - 1) * 0.7 +
        Math.random() * 0.7;


      enemies.push({

        x: lane,

        y: -80,

        width: 40,

        height: 70,

        speed: speed

      });

    }


    // =================================
    // BOTSING
    // =================================

    function collision(a, b) {

      return (

        a.x < b.x + b.width &&

        a.x + a.width > b.x &&

        a.y < b.y + b.height &&

        a.y + a.height > b.y

      );

    }


    // =================================
    // LEVEN VERLIEZEN
    // =================================

    function loseLife() {

      lives--;

      updateUI();


      // Auto's verwijderen

      enemies = [];


      // Speler terug naar midden

      player.x = 180;


      // Even rustig opnieuw beginnen

      spawnTimer = 0;


      if (lives <= 0) {

        gameOver = true;


        setTimeout(
          function() {

            alert(
              "💥 GAME OVER!\n\n" +
              "Score: " + score +
              "\nLevel: " + level
            );

            location.reload();

          },
          200
        );

      }

    }


    // =================================
    // AUTO TEKENEN
    // =================================

    function drawCar(car, color) {

      // Schaduw

      ctx.fillStyle =
        "rgba(0,0,0,0.35)";

      ctx.fillRect(
        car.x + 4,
        car.y + 5,
        car.width,
        car.height
      );


      // Auto

      ctx.fillStyle = color;

      ctx.fillRect(
        car.x,
        car.y,
        car.width,
        car.height
      );


      // Voorruit

      ctx.fillStyle = "#111";

      ctx.fillRect(
        car.x + 7,
        car.y + 10,
        car.width - 14,
        20
      );


      // Achterruit

      ctx.fillRect(
        car.x + 7,
        car.y + 40,
        car.width - 14,
        15
      );


      // Wielen

      ctx.fillStyle = "#000";


      ctx.fillRect(
        car.x - 5,
        car.y + 10,
        6,
        20
      );


      ctx.fillRect(
        car.x + car.width - 1,
        car.y + 10,
        6,
        20
      );


      ctx.fillRect(
        car.x - 5,
        car.y + 45,
        6,
        20
      );


      ctx.fillRect(
        car.x + car.width - 1,
        car.y + 45,
        6,
        20
      );

    }


    // =================================
    // WEG
    // =================================

    function drawRoad() {

      // Gras

      ctx.fillStyle = "#198a35";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // Weg

      ctx.fillStyle = "#3d3d3d";

      ctx.fillRect(
        35,
        0,
        330,
        canvas.height
      );


      // Randen

      ctx.fillStyle = "white";

      ctx.fillRect(
        35,
        0,
        5,
        canvas.height
      );


      ctx.fillRect(
        360,
        0,
        5,
        canvas.height
      );


      // Middenstrepen

      if (!paused) {

        roadOffset +=
          4 + level * 0.4;

      }


      if (roadOffset >= 60) {

        roadOffset = 0;

      }


      for (
        let y = -60 + roadOffset;
        y < canvas.height;
        y += 60
      ) {

        ctx.fillRect(
          195,
          y,
          10,
          35
        );

      }

    }


    // =================================
    // UPDATE
    // =================================

    function update() {

      if (
        paused ||
        gameOver
      ) {

        return;

      }


      // Links

      if (moveLeft) {

        player.x -=
          player.speed;

      }


      // Rechts

      if (moveRight) {

        player.x +=
          player.speed;

      }


      // Binnen de weg

      if (player.x < 45) {

        player.x = 45;

      }


      if (player.x > 315) {

        player.x = 315;

      }


      // Vijanden maken

      spawnTimer++;


      const spawnDelay =
        Math.max(
          35,
          90 - level * 5
        );


      if (
        spawnTimer >=
        spawnDelay
      ) {

        spawnEnemy();

        spawnTimer = 0;

      }


      // Vijanden bewegen

      for (
        let i = enemies.length - 1;
        i >= 0;
        i--
      ) {

        const enemy =
          enemies[i];


        enemy.y +=
          enemy.speed;


        // Botsing

        if (
          collision(
            player,
            enemy
          )
        ) {

          enemies.splice(i, 1);

          loseLife();

          return;

        }


        // Auto voorbij

        if (
          enemy.y >
          canvas.height
        ) {

          enemies.splice(i, 1);

          score++;


          // Elke 10 punten
          // een nieuw level

          level =
            Math.floor(
              score / 10
            ) + 1;


          updateUI();

        }

      }

    }


    // =================================
    // TEKENEN
    // =================================

    function draw() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      drawRoad();


      // Vijanden

      enemies.forEach(
        function(enemy) {

          drawCar(
            enemy,
            "#e53935"
          );

        }
      );


      // Speler

      drawCar(
        player,
        "#00e676"
      );


      // Pauze scherm

      if (paused) {

        ctx.fillStyle =
          "rgba(0,0,0,0.7)";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        ctx.fillStyle = "white";

        ctx.textAlign = "center";

        ctx.font =
          "bold 45px Arial";

        ctx.fillText(
          "PAUZE",
          canvas.width / 2,
          280
        );


        ctx.font =
          "20px Arial";

        ctx.fillText(
          "Druk op ▶️",
          canvas.width / 2,
          325
        );


        ctx.textAlign = "left";

      }

    }


    // =================================
    // GAME LOOP
    // =================================

    function gameLoop() {

      update();

      draw();

      requestAnimationFrame(
        gameLoop
      );

    }


    // =================================
    // START
    // =================================

    updateUI();

    gameLoop();

  </script>

</body>
</html>
